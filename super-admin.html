<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0072c6">
<meta name="application-name" content="The SLFA League App">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Super Admin · The SLFA League App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="premium-theme.css">
<link rel="stylesheet" href="flag-mobile.css?v=1">
<style id="slfa-live-text-motion">
/* High-visibility text motion and brightness */
@keyframes slfaLiveTextMove {
  0%,100% { transform:translateX(0); }
  50% { transform:translateX(6px); }
}
@keyframes slfaLiveTextGlow {
  0%,100% { text-shadow:0 0 3px rgba(255,255,255,.12); filter:brightness(1); }
  50% { text-shadow:0 0 12px rgba(145,255,190,.55),0 0 18px rgba(80,185,255,.28); filter:brightness(1.28); }
}
body h1,body h2,body h3,
body .brand p,body .kicker,body .sub,
body .portal-head p,body .portal-head .eyebrow,
body .news-eyebrow,body .ps-eyebrow {
  animation:slfaLiveTextMove 4s ease-in-out infinite,slfaLiveTextGlow 3s ease-in-out infinite !important;
  color:#f1fff5 !important;
}
body .tabs button,body nav button,body .portal nav a,
body .score,body .score-big,body .table th {
  color:#e6f7ff !important;
  text-shadow:0 0 9px rgba(90,190,255,.32) !important;
  animation:slfaLiveTextGlow 3s ease-in-out infinite !important;
}
@media (prefers-reduced-motion:reduce) {
  body h1,body h2,body h3,body .brand p,body .kicker,body .sub,
  body .portal-head p,body .portal-head .eyebrow,body .news-eyebrow,
  body .ps-eyebrow,body .tabs button,body nav button,body .portal nav a,
  body .score,body .score-big,body .table th { animation:none !important; }
}
</style>

</head>
<body data-portal="SUPER_ADMIN">
<header class="portal-head">
  <a class="back" href="index.html">&larr; League Centre</a>
  <h1>Super Admin</h1>
</header>
<main class="portal">
  <section id="signIn" class="card" hidden>
    <h2 class="rt">Sign in</h2>
    <label for="pEmail">Email</label><input id="pEmail" type="email" autocomplete="username">
    <label for="pPass">Password</label><input id="pPass" type="password" autocomplete="current-password">
    <div class="btns"><button class="primary" id="pSignIn">Sign in</button></div>
    <div class="status" id="pStatus"></div>
  </section>
  <section id="portalArea" class="card" hidden>
    <div class="row"><span id="whoName"></span><span class="muted" id="whoRole"></span></div>
    <div id="signedIn"><div id="roleTools"></div></div>
    <div class="btns"><button class="secondary" id="pSignOut">Sign out</button></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="sw-update.js"></script>
<script src="portal.js"></script>
<script src="admin.js"></script>
</body>
</html>
