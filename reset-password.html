<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password · SLFA League App</title>
<link rel="stylesheet" href="styles.css?v=7">
<style>
  body{margin:0;padding:24px 16px;min-height:100vh;box-sizing:border-box}
  .box{max-width:420px;margin:24px auto;background:var(--card,#112441);border:1px solid rgba(120,170,230,.22);border-radius:16px;padding:20px 18px}
  .box h1{font-size:1.3rem;margin:0 0 6px}
  .box p{margin:0 0 14px;line-height:1.5}
  .box label{display:block;margin:12px 0 4px;font-size:.92rem}
  .box input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid rgba(120,170,230,.3);background:rgba(7,15,31,.55);color:inherit;font:inherit}
  .box button{margin-top:16px;width:100%;height:40px;border:0;border-radius:999px;background:#0a5fa8;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .box button:disabled{opacity:.6}
  .box a{color:inherit}
  .status{min-height:1.4em;margin-top:12px;font-size:.92rem}
</style>
</head>
<body>
<main class="box" aria-labelledby="resetTitle">
  <h1 id="resetTitle">Set a new password</h1>
  <div id="needLink" hidden>
    <p>This page only works from the reset link in your email. Ask for a new link from the sign-in screen, then open it on this phone.</p>
    <p><a href="index.html">Back to the League Centre</a></p>
  </div>
  <form id="resetForm" novalidate hidden>
    <label for="newPass">New password (at least 8 characters)</label>
    <input id="newPass" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirmPass">Type it again</label>
    <input id="confirmPass" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="saveBtn">Save new password</button>
    <p class="status" id="status" role="status"></p>
  </form>
  <div id="done" hidden>
    <p>Your password has been changed.</p>
    <p><a href="index.html">Go to the League Centre and sign in</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var cfg = window.SLFA_CONFIG;
  var db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  function $(id) { return document.getElementById(id); }
  var shown = false;
  function showForm() { if (shown) return; shown = true; $('needLink').hidden = true; $('resetForm').hidden = false; }
  // Opening the emailed link signs the person in for password recovery only
  db.auth.onAuthStateChange(function (event) { if (event === 'PASSWORD_RECOVERY') showForm(); });
  db.auth.getSession().then(function (r) {
    if (r.data && r.data.session && window.location.hash.indexOf('type=recovery') !== -1) showForm();
    else if (!shown) $('needLink').hidden = false;
  });
  $('resetForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var a = $('newPass').value, b = $('confirmPass').value;
    if (a.length < 8) { $('status').textContent = 'Use at least 8 characters.'; return; }
    if (a !== b) { $('status').textContent = 'The two passwords do not match.'; return; }
    $('saveBtn').disabled = true; $('status').textContent = 'Saving…';
    db.auth.updateUser({ password: a }).then(function (res) {
      $('saveBtn').disabled = false;
      if (res.error) { $('status').textContent = res.error.message; return; }
      db.auth.signOut().then(function () { $('resetForm').hidden = true; $('done').hidden = false; });
    });
  });
})();
</script>
</body>
</html>
