<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073b2a"><title>SLFA Test Account Portal</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="premium-theme.css"><link rel="stylesheet" href="staff-theme.css?v=1"></head>
<body data-portal="TEST"><header class="portal-head"><a class="back" href="index.html">← League Centre</a><h1>SLFA Test Portal</h1></header>
<main class="portal"><section id="testSignIn" class="card"><h2 class="rt">Test account sign in</h2><p class="muted">For authorised system testing only. Test accounts cannot access official league operations.</p><label for="testEmail">Email</label><input id="testEmail" type="email" autocomplete="username"><label for="testPassword">Password</label><input id="testPassword" type="password" autocomplete="current-password"><div class="btns"><button class="primary" id="testSignInBtn">Sign in</button></div><div id="testLoginStatus" class="status"></div></section>
<section id="testArea" class="card" hidden><div class="row"><strong id="testName"></strong><span class="badge">TEST ACCOUNT</span></div><p id="testRole" class="muted"></p><div id="testDashboard"></div><div class="btns"><button class="secondary" id="testSignOut">Sign out</button></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="test-portal.js"></script></body></html>
