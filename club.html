<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0072c6">
<meta name="application-name" content="The SLFA League App">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Club Manager · The SLFA League App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="premium-theme.css">
<link rel="stylesheet" href="flag-mobile.css?v=4">
<style id="slfa-live-text-motion">
/* Premium SLFA typography: restrained motion, clean contrast and flag-inspired accents */
@keyframes slfaPremiumTitle {
  0%,100% { text-shadow:0 1px 2px rgba(0,0,0,.18),0 0 5px rgba(120,255,175,.10); }
  50% { text-shadow:0 1px 2px rgba(0,0,0,.18),0 0 10px rgba(120,255,175,.22),0 0 15px rgba(95,175,255,.12); }
}
@keyframes slfaPremiumAccent {
  0%,100% { opacity:.82; }
  50% { opacity:1; }
}
body h1,body h2,body h3,
body .brand p,body .kicker,body .sub,
body .portal-head p,body .portal-head .eyebrow,
body .news-eyebrow,body .ps-eyebrow {
  color:#f5fff8 !important;
  animation:slfaPremiumTitle 5.5s ease-in-out infinite !important;
}
body h1,body .portal-head h1 {
  letter-spacing:.0em;
  text-wrap:balance;
}
body .brand p,body .portal-head .eyebrow,
body .news-eyebrow,body .ps-eyebrow,body .kicker {
  color:#c8f6dc !important;
}
body .tabs button,body nav button,body .portal nav a {
  color:#edf8ff !important;
  transition:color .22s ease,text-shadow .22s ease,transform .22s ease,background-color .22s ease;
}
body .tabs button:hover,body nav button:hover,body .portal nav a:hover {
  color:#ffffff !important;
  text-shadow:0 0 9px rgba(90,190,255,.30);
}
body .score,body .score-big,body .table th {
  color:#effaff !important;
  text-shadow:0 1px 5px rgba(75,170,255,.18) !important;
}
body button,body a { -webkit-tap-highlight-color:transparent; }
@media (prefers-reduced-motion:reduce) {
  body h1,body h2,body h3,body .brand p,body .kicker,body .sub,
  body .portal-head p,body .portal-head .eyebrow,body .news-eyebrow,
  body .ps-eyebrow { animation:none !important; }
  body .tabs button,body nav button,body .portal nav a { transition:none !important; }
}
</style>

</head>
<body data-portal="CLUB_ADMIN">
<header class="portal-head">
  <a class="back" href="index.html">&larr; League Centre</a>
  <h1>Club Manager</h1>
</header>
<main class="portal">
  <section id="signIn" class="card" hidden>
    <h2 class="rt">Sign in</h2>
    <label for="pEmail">Email</label><input id="pEmail" type="email" autocomplete="username">
    <label for="pPass">Password</label><input id="pPass" type="password" autocomplete="current-password">
    <div class="btns"><button class="primary" id="pSignIn">Sign in</button></div>
    <div class="status" id="pStatus"></div>
  </section>
  <section id="portalArea" class="card" hidden>
    <div class="row"><span id="whoName"></span><span class="muted" id="whoRole"></span></div>
    <div id="signedIn"><div id="roleTools"></div></div>
    <div class="btns"><button class="secondary" id="pSignOut">Sign out</button></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="sw-update.js"></script>
<script src="portal.js"></script>
<script src="admin.js"></script>
</body>
</html>
